<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>冒充他人投诉须知</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 内联样式优化加载速度 */
        .impersonation-container {
            min-height: 100vh;
            background-color: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        .impersonation-content {
            padding: 20px;
        }
        .impersonation-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .impersonation-text {
            font-size: 14px;
            color: #333;
            line-height: 1.6;
            background-color: #fff;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 30px;
        }
        .impersonation-text p {
            margin-bottom: 15px;
        }
        .impersonation-text p:last-child {
            margin-bottom: 0;
        }
        .next-btn-container {
            padding: 0 20px 20px;
        }
        .next-btn {
            width: 100%;
            height: 44px;
            background-color: #07c160;
            color: #fff;
            border: none;
            border-radius: 22px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .next-btn:active {
            opacity: 0.8;
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <!-- 冒充他人投诉须知页面 -->
    <div class="container impersonation-container">
        <div class="impersonation-content">
            <div class="impersonation-title">针对冒充他人的投诉流程，请了解以下须知：</div>
            <div class="impersonation-text">
                <p>若发现该用户恶意冒充你或你朋友的身份，引起他人混淆、误认的，利用他人名义或公众人物身份招摇撞骗、误导他人的，你可以通过该流程发起投诉并提供必要证明材料。你应当保证投诉是基于善意且真实有效。</p>
                <p>若该用户的行为并非冒用你的身份，而是侵犯你的姓名权、肖像权或名誉权等人身权利，你可以在投诉中选择"存在侵权行为"；若该用户伪造社交资料假冒他人进行诈骗，你可以在投诉中选择"存在欺诈骗钱行为"。</p>
            </div>
        </div>
        
        <div class="next-btn-container">
            <button class="next-btn">下一步</button>
        </div>
    </div>

    <script>
        // 简化JavaScript，优化加载速度
        document.addEventListener('DOMContentLoaded', function() {
            // 获取元素
            const nextBtn = document.querySelector('.next-btn');
            
            // 下一步按钮点击事件
            nextBtn.addEventListener('click', function() {
                window.location.href = 'submit.html';
            });
        });
    </script>
</body>
</html>
